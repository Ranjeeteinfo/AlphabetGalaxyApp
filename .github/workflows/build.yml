name: Android Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  Integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify project files
        run: |
          test -f buildozer.spec
          test -f main.py

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl ca-certificates \
            autoconf automake autopoint libtool pkg-config \
            cmake build-essential \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer virtualenv

      - name: Setup Android SDK manually
        run: |
          set -eux

          mkdir -p "$ANDROID_SDK_ROOT"

          cd /tmp
          curl -L -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"

          # Google SDK ZIP usually extracts under cmdline-tools/cmdline-tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            cp -a "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          else
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            cp -a "$ANDROID_SDK_ROOT/cmdline-tools/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Cache Android and Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure Buildozer
        shell: bash
        run: |
          set -e

          if grep -Eq '^[[:space:]]*android.accept_sdk_license[[:space:]]*=' buildozer.spec; then
            sed -i \
              's/^[[:space:]]*android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/' \
              buildozer.spec
          elif grep -Eq '^[[:space:]]*#[[:space:]]*android.accept_sdk_license[[:space:]]*=' buildozer.spec; then
            sed -i \
              's/^[[:space:]]*#[[:space:]]*android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          fi

      - name: Create APK
        shell: bash
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KivyMD-Debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
          

